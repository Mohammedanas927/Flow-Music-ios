name: Build Flow Music IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Xcode build files
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-xcode-${{ hashFiles('FlowMusic/**', 'FlowMusic.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Build app
        run: |
          xcodebuild \
            -project FlowMusic.xcodeproj \
            -scheme FlowMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FlowMusic.app Payload/
          /usr/bin/zip -qr FlowMusic-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlowMusic-Unsigned-IPA
          path: FlowMusic-unsigned.ipa
          if-no-files-found: error
