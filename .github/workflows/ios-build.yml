
name: Build Flow Music iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q FlowMusic-iOS-Starter.zip -d extracted

      - name: Build
        run: |
          xcodebuild \
            -project extracted/FlowMusic.xcodeproj \
            -scheme FlowMusic \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: FlowMusic-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/FlowMusic.app
          if-no-files-found: error
          retention-days: 7
