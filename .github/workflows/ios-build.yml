name: Fast Flow Music Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project FlowMusic.xcodeproj \
            -scheme FlowMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FlowMusic.app Payload/
          zip -qr FlowMusic-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FlowMusic-Unsigned-IPA
          path: FlowMusic-unsigned.ipa
